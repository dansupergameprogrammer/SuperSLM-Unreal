name: coherence-checks

# File and text checks that need only Python and git, so they run on a standard hosted runner.
#
# TRIGGER: manual only. The maintainer runs CI when he chooses to; nothing here fires on push
# or pull request. Dispatch it from the Actions tab, or with
#   gh workflow run coherence-checks.yml --ref <branch>
#
# Where the vendored SuperSLM tree lives is configuration (VENDORED_DIRS below), not an
# assumption built into the scripts: each check takes the directory as an argument, and a
# space-separated list is checked one directory at a time.
#
# The pre-publish scrub of private material (local paths, private names and records) is not a
# workflow here. It runs against this repository's content before a sync or tag, from outside
# it, never as a check committed into the public repository it inspects.

on:
  workflow_dispatch:

env:
  PLUGIN_DIR: Plugins/SuperSLMUnreal
  UPLUGIN: Plugins/SuperSLMUnreal/SuperSLMUnreal.uplugin
  CHANGELOG: CHANGELOG.md
  VENDORED_DIRS: Plugins/SuperSLMUnreal/Source/ThirdParty/SuperSLM
  SUPERSLM_UPSTREAM: https://github.com/dansupergameprogrammer/SuperSLM.git

permissions:
  contents: read

jobs:
  vendored-coherence:
    # The vendored SuperSLM source is byte-for-byte the tag VENDORED_VERSION.txt names (fetched
    # from upstream), holds no extra file, and matches VENDORED_MANIFEST.sha256. Reads git
    # blobs, not the checkout, so line-ending conversion cannot mask or fake a difference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Vendored tree against the pinned SuperSLM tag, and its manifest
        run: |
          for d in $VENDORED_DIRS; do
            python .github/scripts/check_vendored_against_tag.py \
              --vendored-dir "$d" \
              --upstream "$SUPERSLM_UPSTREAM" \
              --manifest-checker "$PLUGIN_DIR/ci/check_vendored_tree_matches_manifest.py"
          done

  vendored-wrappers:
    # Every source SuperSLM's own CMake build compiles has exactly one wrapper in the plugin
    # module, so a new upstream source file cannot be silently left out of the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Wrapper set matches the vendored source lists
        run: python "$PLUGIN_DIR/ci/check_vendored_wrappers_complete.py" --plugin-root "$PLUGIN_DIR"

  version-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # tags are needed, not only the checked-out commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Version identity
        # --allow-untagged: most commits land between releases. release.yml runs the same check
        # with --release before tagging and again, without the flag, after the tag is cut.
        run: |
          args=""
          for d in $VENDORED_DIRS; do args="$args --vendored-dir $d"; done
          python .github/scripts/check_version_identity.py \
            --uplugin "$UPLUGIN" --changelog "$CHANGELOG" $args --allow-untagged
